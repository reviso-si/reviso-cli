[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reviso-cli"
version = "0.1.2"
description = "Command line client for Reviso: publish drafts for human review, read reviewer comments back, and publish revisions safely."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["reviso", "review", "collaboration", "documents", "cli", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Markup",
]

# The client is stdlib-only on purpose. Installing it must not pull a dependency
# graph into an agent's environment to publish a Markdown file.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

# PyPI renders these as the package page's links. Without them the page is a
# dead end: someone who finds the package by search has no route to the docs,
# the source, or the issue tracker.
[project.urls]
Homepage = "https://reviso.work"
Documentation = "https://github.com/reviso-si/reviso-agent"
Repository = "https://github.com/reviso-si/reviso-cli"
Issues = "https://github.com/reviso-si/reviso-cli/issues"

[project.scripts]
reviso = "reviso_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
