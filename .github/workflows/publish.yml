name: Publish

# Publishing to PyPI uses Trusted Publishing: PyPI trusts this workflow through
# OIDC, so no API token is stored in the repository or in anyone's environment.
#
# The PyPI pending publisher for this project must name this exact file:
#   owner: reviso-si   repo: reviso-cli   workflow: publish.yml
# Keeping the filename and the publisher config in step matters more than the
# name itself -- either can change, but they have to match.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pytest -q
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # OIDC is the whole mechanism: without id-token PyPI cannot verify the
    # caller, and the publish step fails rather than falling back to a token.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
